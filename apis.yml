name: HYPERZ AI
description: >-
  HYPERZ AI is a generative-AI company focused on professional photography and
  headshot generation, offering both consumer (B2C) and enterprise (B2B)
  products. Its consumer tool, Business Photo AI (businessphoto.ai), turns
  selfies into professional headshots with customizable poses, outfits, and
  backgrounds. Its enterprise product, HYPERTURE (hyperture.ai), delivers
  consistent, studio-grade headshots for teams with brand-consistency controls,
  member approval workflows, and C2PA provenance verification. The company was
  surfaced as a portfolio company of the venture firm qiming and added to the
  API Evangelist network for enrichment. As of this pass it publishes no public
  developer API, SDK, documentation, or /.well-known discovery surface — the
  products are end-user applications rather than a developer platform.
